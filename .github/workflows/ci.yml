name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      SEED: '123'
    steps:
      - uses: actions/checkout@v6
      - run: make cli test BF_TRIALS=20
      - run: |
          ./build/sudoku_cli --generate 40 --seed 123 > build/example.txt
          ./build/sudoku_cli --solve build/example.txt --solver mrv
      - uses: actions/upload-artifact@v7
        with:
          name: strict-comparison-${{ matrix.compiler }}
          path: build/benchmarks/
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - run: make gui
      - name: Render a seeded game without a display
        env:
          SDL_VIDEODRIVER: dummy
          GUI_SCREENSHOT: build/gui.bmp
          GUI_SCREENSHOT_MODE: game
          GUI_SCREENSHOT_K: '50'
          SEED: '123'
        run: ./build/sudoku_gui && test -s build/gui.bmp
      - uses: actions/upload-artifact@v7
        with:
          name: gui-screenshot
          path: build/gui.bmp
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: |
          make cli
          mkdir -p build/release/sudoku-linux-x86_64
          cp build/sudoku_cli LICENSE README.md build/release/sudoku-linux-x86_64/
          ./build/sudoku_cli --generate 40 --seed 123 > build/release/sudoku-linux-x86_64/example.txt
          tar -C build/release -czf build/sudoku-linux-x86_64.tar.gz sudoku-linux-x86_64
          (cd build && sha256sum sudoku-linux-x86_64.tar.gz > SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/sudoku-linux-x86_64.tar.gz build/SHA256SUMS --verify-tag --title "Sudoku CLI and SDL2 GUI $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
